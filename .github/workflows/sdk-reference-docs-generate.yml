name: SDK Reference Docs Generate
# On pushes to main that touch the SDK source or docs tooling, generates the
# Swift checkout SDK reference docs (DocC → MDX), uploads them as an artifact,
# and dispatches to crossbit-main where the receiver workflow copies them into
# the Mintlify docs and opens a PR for review.

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "scripts/docc-to-markdown.py"
      - "Package.swift"
      - ".github/workflows/sdk-reference-docs-generate.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to generate docs from (defaults to the triggering ref)"
        required: false
        type: string

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  SIMULATOR_DEST: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
  DOCC_BUILD_DIR: /tmp/crossmint-checkout-swift-docc
  DOCS_OUTPUT: sdk-reference/checkout/swift

permissions:
  contents: read

concurrency:
  group: sdk-reference-docs-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate SDK Reference Docs
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme crossmint-checkout-swift \
            -destination "$SIMULATOR_DEST" \
            -derivedDataPath "$DOCC_BUILD_DIR" \
            OTHER_DOCC_FLAGS="--fallback-display-name CrossmintCheckout --fallback-bundle-identifier com.crossmint.checkout --fallback-bundle-version 1"

      - name: Generate MDX docs
        run: |
          archive="$DOCC_BUILD_DIR/Build/Products/Debug-iphonesimulator/CrossmintCheckout.doccarchive"
          if [ ! -d "$archive" ]; then
            echo "DocC archive not found at $archive"
            exit 1
          fi
          python3 scripts/docc-to-markdown.py "$archive" --output "$DOCS_OUTPUT"

      - name: Verify docs were generated
        run: |
          if [ -z "$(find sdk-reference/ -name '*.mdx' -print -quit)" ]; then
            echo "No MDX files generated"
            exit 1
          fi

      - name: Upload generated docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-reference-docs
          path: sdk-reference/
          retention-days: 7

      - name: Generate App Token
        id: generate_app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CROSSMINT_DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.CROSSMINT_DEPLOY_BOT_PRIVATE_KEY }}
          owner: Paella-Labs
          repositories: crossbit-main

      - name: Dispatch to crossbit-main
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.generate_app_token.outputs.token }}
          repository: Paella-Labs/crossbit-main
          event-type: sdk-reference-docs-update
          client-payload: '{"run_id": "${{ github.run_id }}", "packages": "checkout/swift", "source_repo": "crossmint-checkout-swift", "source_ref": ${{ toJSON(inputs.ref || github.ref_name) }}}'
